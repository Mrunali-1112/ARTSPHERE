<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – ArtSphere</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="mobile-frame-container">
        <main class="screen-container login-screen">
            <!-- Decorative Visual Elements -->
            <img src="/images/top_wave_decor.png" alt="" class="decor-top-wave">
            <img src="/images/paint_jar_decor.png" alt="" class="decor-bottom-jar">
            <img src="/images/watercolor_box_decor.png" alt="" class="decor-bottom-palette">

            <!-- Top Nav with Back Button -->
            <nav class="top-nav-bar">
                <a href="/pages/landing.html" class="btn-icon-back" aria-label="Go Back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
            </nav>

            <!-- Centered Branding Header -->
            <header class="brand-header-centered">
                <img src="/images/logo_with_text.png" alt="ArtSphere – The Artist Community" class="brand-logo-img">
                <h1>Welcome Back!</h1>
                <p class="sub-tagline">Login to continue your creative journey</p>
            </header>

            <!-- Login Form -->
            <section class="login-form-container">
                <div id="alertMessage" class="auth-alert-message"></div>

                <form id="loginForm" autocomplete="on">
                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label" for="usernameOrEmail">Email</label>
                        <div class="input-icon-wrapper">
                            <span class="input-leading-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>
                            <input
                                type="text"
                                id="usernameOrEmail"
                                name="usernameOrEmail"
                                class="form-input"
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-icon-wrapper">
                            <span class="input-leading-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input has-trailing-icon"
                                placeholder="Enter your password"
                                required
                            >
                            <button type="button" class="input-trailing-action" id="togglePasswordBtn" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Options Row -->
                    <div class="form-options-row">
                        <label class="remember-me-label">
                            <input type="checkbox" id="rememberMe" class="remember-me-checkbox" checked>
                            Remember me
                        </label>
                        <a href="#" class="forgot-password-link">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary-gradient" id="submitBtn">
                        Login
                        <span>&rarr;</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider-or">OR</div>

                <!-- Social Logins -->
                <div class="social-buttons-container">
                    <button type="button" class="btn-social">
                        <svg viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        Continue with Google
                    </button>
                    <button type="button" class="btn-social">
                        <svg viewBox="0 0 24 24" fill="#1877F2">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Continue with Facebook
                    </button>
                    <button type="button" class="btn-social">
                        <svg viewBox="0 0 24 24" fill="#000000">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.77 1.06-1.85.94-2.93-.93.04-2.07.62-2.72 1.39-.58.67-1.09 1.77-.95 2.83 1.05.08 2.1-.52 2.73-1.29z"/>
                        </svg>
                        Continue with Apple
                    </button>
                </div>

                <!-- Footer link -->
                <p class="login-footer-text">
                    Don't have an account?
                    <a href="/pages/signup.html">
                        Sign up for ArtSphere
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </a>
                </p>
            </section>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
