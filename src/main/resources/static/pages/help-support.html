<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help & Support – ArtSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/help-support.css">
</head>
<body>
    <div class="app-layout">
        <div class="support-screen">

            <!-- 1. Top App Header -->
            <header class="app-top-header">
                <div class="header-left">
                    <button class="btn-icon-nav" id="btnHeaderBack" aria-label="Go Back">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <a href="/pages/home.html" class="header-logo-wrap" aria-label="ArtSphere Home">
                        <img src="/images/logo_header.png" alt="ArtSphere" class="header-logo-img">
                    </a>
                </div>
                <div class="header-right">
                    <a href="/pages/notifications.html" class="btn-icon-nav" aria-label="Notifications" title="Notifications">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="header-notification-badge"></span>
                    </a>
                    <a href="/pages/artist-profile.html?id=101" class="header-avatar-link" aria-label="View Profile">
                        <img src="/images/user_avatar_nav.png" alt="User Profile" class="header-avatar-img" id="userHeaderAvatar">
                    </a>
                </div>
            </header>

            <!-- 2. Support Hero Section with Online Pill -->
            <section class="support-hero">
                <div class="support-hero-left">
                    <button class="btn-circle-back" id="btnPageBack" aria-label="Back to Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </button>
                    <div class="support-hero-texts">
                        <h1 class="page-title">Help & Support</h1>
                        <p class="page-subtitle">Chat with our support team. We're here to help!</p>
                    </div>
                </div>
                <div class="support-status-pill" aria-label="Support Status: Online">
                    <span class="online-indicator"></span>
                    <span class="status-text">Online</span>
                </div>
            </section>

            <!-- 3. Chat Messages Container -->
            <main class="chat-area" id="chatArea" role="log" aria-live="polite">
                <!-- Day Divider -->
                <div class="chat-date-divider">
                    <span class="date-badge">Today</span>
                </div>

                <!-- Messages Stream -->
                <div class="messages-list" id="messagesList">

                    <!-- Message 1: Initial Greeting -->
                    <div class="msg-row bot-msg">
                        <div class="bot-avatar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                                <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                            </svg>
                        </div>
                        <div class="msg-body">
                            <div class="msg-bubble bot-bubble">
                                <p class="bubble-p">Hi! 👋</p>
                                <p class="bubble-p">Welcome to ArtSphere Support!</p>
                                <p class="bubble-p">How can we help you today?</p>
                            </div>
                            <span class="msg-time">9:41 AM</span>
                        </div>
                    </div>

                    <!-- Message 2: Initial Quick Question Chips -->
                    <div class="msg-row bot-msg">
                        <div class="bot-avatar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                                <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                            </svg>
                        </div>
                        <div class="msg-body">
                            <div class="msg-bubble bot-bubble">
                                <p class="bubble-p">Here are some common topics creators ask about:</p>
                            </div>
                            <div class="quick-questions-container" id="quickQuestionsContainer">
                                <button type="button" class="btn-question-chip" data-question="How do I create a post?">
                                    <span>How do I create a post?</span>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </button>
                                <button type="button" class="btn-question-chip" data-question="What types of posts are allowed?">
                                    <span>What types of posts are allowed?</span>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </button>
                                <button type="button" class="btn-question-chip" data-question="Can I edit or delete my post?">
                                    <span>Can I edit or delete my post?</span>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </button>
                                <button type="button" class="btn-question-chip" data-question="Why is my post not visible?">
                                    <span>Why is my post not visible?</span>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </button>
                                <button type="button" class="btn-question-chip" data-question="I need help with something else">
                                    <span>I need help with something else</span>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </button>
                            </div>
                            <span class="msg-time">9:42 AM</span>
                        </div>
                    </div>

                </div>
            </main>

            <!-- 4. Bottom Message Input Bar -->
            <div class="chat-input-bar">
                <button type="button" class="btn-attachment" id="btnAttachment" aria-label="Attach File">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <input type="file" id="fileAttachInput" style="display:none;">

                <input type="text" id="chatMessageInput" class="chat-input-field" placeholder="Type your message..." autocomplete="off">

                <button type="button" class="btn-send-message" id="btnSendMessage" aria-label="Send Message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>

            <!-- 5. Bottom Navigation Bar -->
            <nav class="bottom-nav" aria-label="Main Navigation">
                <a href="/pages/home.html" class="bottom-nav-item" aria-label="Home">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="nav-text">Home</span>
                </a>

                <a href="/pages/discover.html" class="bottom-nav-item" aria-label="Discover">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span class="nav-text">Discover</span>
                </a>

                <div class="bottom-nav-center">
                    <a href="/pages/create-post.html" class="fab-center-btn" aria-label="Create Post">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </a>
                </div>

                <a href="/pages/notifications.html" class="bottom-nav-item" aria-label="Activity">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="nav-text">Activity</span>
                </a>

                <a href="/pages/settings.html" class="bottom-nav-item active" aria-label="Profile" aria-current="page">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="nav-text">Profile</span>
                </a>
            </nav>

        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/help-support.js"></script>
</body>
</html>
