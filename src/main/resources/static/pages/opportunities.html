<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtSphere – Opportunities</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/opportunities.css">
</head>
<body>
    <div class="mobile-frame-container wide-landing">
        <main class="screen-container opportunities-screen">

            <!-- Sticky Header Navbar -->
            <header class="opp-header">
                <a href="/pages/home.html" class="header-logo-link" aria-label="ArtSphere Home">
                    <img src="/images/logo_header.png" alt="ArtSphere – The Artist Community" class="header-logo-img">
                </a>

                <div class="header-right-actions">
                    <button class="header-action-btn" id="headerSearchBtn" aria-label="Search" onclick="document.getElementById('oppSearchInput').focus()">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>

                    <button class="header-action-btn bell-btn" id="headerNotifyBtn" aria-label="Notifications" onclick="alert('No new notifications')">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notification-dot"></span>
                    </button>

                    <div class="header-profile-dropdown" id="userMenuWrapper">
                        <div class="avatar-clickable" id="headerUserAvatarBtn" role="button" aria-label="Open User Menu">
                            <img src="/images/user_avatar_nav.png" alt="User Profile" class="header-user-avatar" id="headerUserAvatar">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.5" class="header-dropdown-chevron">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="user-dropdown-menu" id="userDropdownMenu">
                            <a href="/pages/artist-profile.html?id=101" class="dropdown-item">My Profile</a>
                            <a href="/pages/portfolio.html?id=101" class="dropdown-item">My Portfolio</a>
                            <a href="/pages/opportunities.html" class="dropdown-item">Opportunities</a>
                            <a href="/pages/my-applications.html" class="dropdown-item">My Applications</a>
                            <div class="dropdown-divider"></div>
                            <button class="dropdown-item logout-item" id="logoutBtn">Log Out</button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Opportunities Hero Title & Art -->
            <section class="opp-hero-section">
                <div class="opp-hero-text">
                    <h1 class="opp-hero-title">Oppor<span class="gradient-text">tunities</span></h1>
                    <p class="opp-hero-subtitle">Discover auditions, gigs, collaborations, competitions, internships and more.</p>
                </div>
                <div class="opp-hero-visual">
                    <img src="/images/opp_hero_easel.png" alt="Art Easel & Paintbrushes" class="opp-hero-img">
                </div>
            </section>

            <!-- Category Filter Pills -->
            <section class="opp-categories-section">
                <div class="opp-categories-scroll" id="categoriesScroll">
                    <button class="opp-cat-pill active" data-category="All">
                        <span>All</span>
                    </button>
                    <button class="opp-cat-pill" data-category="Auditions">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                        <span>Auditions</span>
                    </button>
                    <button class="opp-cat-pill" data-category="Collaborations">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>Collaborations</span>
                    </button>
                    <button class="opp-cat-pill" data-category="Gigs">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                        <span>Gigs</span>
                    </button>
                    <button class="opp-cat-pill" data-category="Competitions">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                            <path d="M4 22h16"></path>
                            <path d="M10 14.66V17c0 .55-.45 1-1 1H8v4h8v-4h-1c-.55 0-1-.45-1-1v-2.34"></path>
                            <path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path>
                        </svg>
                        <span>Competitions</span>
                    </button>
                    <button class="opp-cat-pill" data-category="Internships">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                        </svg>
                        <span>Internships</span>
                    </button>
                </div>
            </section>

            <!-- Search & Filter Row -->
            <section class="opp-search-section">
                <div class="opp-search-bar">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A82A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="oppSearchInput" class="opp-search-input" placeholder="Search opportunities..." autocomplete="off">
                    <button class="search-clear-btn" id="searchClearBtn" style="display: none;" aria-label="Clear Search">&times;</button>
                </div>

                <button class="opp-filters-btn" id="filterModalBtn" aria-label="Filters">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="21" x2="4" y2="14"></line>
                        <line x1="4" y1="10" x2="4" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12" y2="3"></line>
                        <line x1="20" y1="21" x2="20" y2="16"></line>
                        <line x1="20" y1="12" x2="20" y2="3"></line>
                        <line x1="1" y1="14" x2="7" y2="14"></line>
                        <line x1="9" y1="8" x2="15" y2="8"></line>
                        <line x1="17" y1="16" x2="23" y2="16"></line>
                    </svg>
                    <span>Filters</span>
                </button>
            </section>

            <!-- Featured Opportunity Section -->
            <section class="opp-section" id="featuredSection">
                <div class="section-header">
                    <h2 class="section-title">Featured <span class="gradient-text">Opportunity</span></h2>
                    <a href="#latestSection" class="see-all-link">See All &rarr;</a>
                </div>

                <div class="featured-card-wrapper" id="featuredOppContainer">
                    <!-- Loaded dynamically via JavaScript -->
                    <div class="card-loading-shimmer"></div>
                </div>
            </section>

            <!-- Latest Opportunities Section -->
            <section class="opp-section" id="latestSection">
                <div class="section-header">
                    <h2 class="section-title">Latest <span class="gradient-text">Opportunities</span></h2>
                    <span class="see-all-link" id="seeAllLatestBtn">See All &rarr;</span>
                </div>

                <div class="latest-cards-list" id="latestOppsContainer">
                    <!-- Loaded dynamically via JavaScript -->
                    <div class="card-loading-shimmer"></div>
                </div>
            </section>

            <!-- Bottom Navigation Bar -->
            <nav class="bottom-nav-bar" aria-label="Main Navigation">
                <a href="/pages/home.html" class="nav-item" aria-label="Home">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="nav-label">Home</span>
                </a>

                <a href="/pages/discover.html" class="nav-item" aria-label="Discover">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span class="nav-label">Discover</span>
                </a>

                <!-- Central + Action Button -->
                <div class="nav-item-center">
                    <button class="nav-fab-btn" id="centralCreateBtn" aria-label="Create New Content" onclick="window.location.href='/pages/portfolio.html?id=101'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>

                <a href="/pages/opportunities.html" class="nav-item active" aria-label="Opportunities">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    <span class="nav-label">Opportunities</span>
                </a>

                <a href="/pages/artist-profile.html?id=101" class="nav-item" id="bottomNavProfile" aria-label="Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>

        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/opportunities.js"></script>
</body>
</html>
