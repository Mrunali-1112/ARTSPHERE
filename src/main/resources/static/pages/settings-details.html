<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile – ArtSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/settings-details.css">
</head>
<body>
    <div class="app-layout">
        <div class="edit-profile-screen">

            <!-- 1. Top App Header -->
            <header class="app-top-header">
                <div class="header-left">
                    <button class="btn-icon-nav" id="btnHeaderBack" aria-label="Go Back">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <a href="/pages/home.html" class="header-logo-wrap" aria-label="ArtSphere Home">
                        <img src="/images/logo_header.png" alt="ArtSphere" class="header-logo-img">
                    </a>
                </div>
                <div class="header-right">
                    <a href="/pages/notifications.html" class="btn-icon-nav" aria-label="Notifications" title="Notifications">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="header-notification-badge"></span>
                    </a>
                    <a href="/pages/artist-profile.html?id=101" class="header-avatar-link" aria-label="View Profile">
                        <img src="/images/user_avatar_nav.png" alt="User Profile" class="header-avatar-img" id="userHeaderAvatar">
                    </a>
                </div>
            </header>

            <!-- 2. Hero / Header Title Section -->
            <section class="edit-profile-hero">
                <div class="hero-title-row">
                    <button class="btn-circle-back" id="btnPageBack" aria-label="Back to Settings">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </button>
                    <div class="hero-texts">
                        <h1 class="page-title">Edit Profile</h1>
                        <p class="page-subtitle">Keep your profile updated and let your creativity shine!</p>
                    </div>
                </div>
            </section>

            <!-- 3. Form Content -->
            <main class="edit-profile-main">
                <form id="editProfileForm" autocomplete="off" onsubmit="return false;">

                    <!-- Card 1: Profile Photo -->
                    <section class="form-card profile-photo-card">
                        <div class="card-header">
                            <div class="card-icon-box">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </div>
                            <div class="card-header-texts">
                                <h2 class="card-title">Profile Photo</h2>
                                <p class="card-desc">Choose a photo that represents you</p>
                            </div>
                        </div>

                        <div class="photo-uploader-row">
                            <div class="avatar-preview-wrap">
                                <img src="/images/user_avatar_nav.png" alt="Profile Preview" id="avatarPreview" class="avatar-preview-img">
                                <button type="button" class="avatar-camera-btn" id="btnCameraBadge" aria-label="Upload Photo">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                </button>
                            </div>
                            <div class="photo-actions">
                                <button type="button" class="btn-change-photo" id="btnChangePhoto">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                    <span>Change Photo</span>
                                </button>
                                <input type="file" id="fileAvatarInput" accept="image/*" style="display:none;">
                            </div>
                        </div>
                    </section>

                    <!-- Card 2: Basic Information -->
                    <section class="form-card">
                        <div class="card-header">
                            <div class="card-icon-box">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </div>
                            <div class="card-header-texts">
                                <h2 class="card-title">Basic Information</h2>
                            </div>
                        </div>

                        <div class="card-fields">
                            <div class="form-group">
                                <label for="inputFullName" class="form-label">Name</label>
                                <input type="text" id="inputFullName" class="form-control" placeholder="Mrunali Shinde" required>
                            </div>

                            <div class="form-row-2">
                                <div class="form-group">
                                    <label for="inputUsername" class="form-label">Username</label>
                                    <input type="text" id="inputUsername" class="form-control" placeholder="mrunali_art">
                                </div>
                                <div class="form-group">
                                    <label for="inputEmail" class="form-label">Email</label>
                                    <input type="email" id="inputEmail" class="form-control form-control-disabled" placeholder="mrunali.shinde@example.com" disabled readonly>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="inputBio" class="form-label">Bio</label>
                                <div class="textarea-wrapper">
                                    <textarea id="inputBio" class="form-control form-textarea" rows="3" maxlength="150" placeholder="Art enthusiast | Sketching my way through life ✨"></textarea>
                                    <span class="char-count" id="bioCounter">0/150</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Card 3: Creative Information -->
                    <section class="form-card">
                        <div class="card-header">
                            <div class="card-icon-box icon-palette">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
                                    <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
                                    <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
                                    <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
                                    <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
                                </svg>
                            </div>
                            <div class="card-header-texts">
                                <h2 class="card-title">Creative Information</h2>
                            </div>
                        </div>

                        <div class="card-fields">
                            <div class="form-row-2">
                                <div class="form-group">
                                    <label for="selectArtistType" class="form-label">Artist Type</label>
                                    <div class="select-wrapper">
                                        <select id="selectArtistType" class="form-control form-select">
                                            <option value="Illustrator">Illustrator</option>
                                            <option value="Visual Artist">Visual Artist</option>
                                            <option value="Digital Artist">Digital Artist</option>
                                            <option value="Painter">Painter</option>
                                            <option value="Photographer">Photographer</option>
                                            <option value="Concept Artist">Concept Artist</option>
                                            <option value="3D Artist">3D Artist</option>
                                            <option value="Sculptor">Sculptor</option>
                                            <option value="Calligrapher">Calligrapher</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="inputSkills" class="form-label">Skills / Medium</label>
                                    <input type="text" id="inputSkills" class="form-control" placeholder="Digital Art, Sketching, Painting">
                                </div>
                            </div>

                            <div class="form-row-2">
                                <div class="form-group">
                                    <label for="inputLocation" class="form-label">Location</label>
                                    <div class="input-icon-wrap">
                                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                            <circle cx="12" cy="10" r="3"></circle>
                                        </svg>
                                        <input type="text" id="inputLocation" class="form-control with-icon" placeholder="Pune, India">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="inputPortfolioLink" class="form-label">Portfolio Link (Optional)</label>
                                    <div class="input-icon-wrap">
                                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                                        </svg>
                                        <input type="url" id="inputPortfolioLink" class="form-control with-icon" placeholder="https://mrunaliart.carrd.co">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Card 4: Social Links (Optional) -->
                    <section class="form-card">
                        <div class="card-header">
                            <div class="card-icon-box icon-social">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="18" cy="5" r="3"></circle>
                                    <circle cx="6" cy="12" r="3"></circle>
                                    <circle cx="18" cy="19" r="3"></circle>
                                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                                </svg>
                            </div>
                            <div class="card-header-texts">
                                <h2 class="card-title">Social Links (Optional)</h2>
                            </div>
                        </div>

                        <div class="form-row-3">
                            <div class="form-group">
                                <label for="inputInstagram" class="form-label">Instagram</label>
                                <div class="input-icon-wrap">
                                    <svg class="field-icon social-icon-ig" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                                    </svg>
                                    <input type="text" id="inputInstagram" class="form-control with-icon" placeholder="@mrunali_art">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="inputBehance" class="form-label">Behance</label>
                                <div class="input-icon-wrap">
                                    <span class="field-icon behance-icon">Bē</span>
                                    <input type="text" id="inputBehance" class="form-control with-icon" placeholder="Add your Behance">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="inputYoutube" class="form-label">YouTube</label>
                                <div class="input-icon-wrap">
                                    <svg class="field-icon social-icon-yt" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                                    </svg>
                                    <input type="text" id="inputYoutube" class="form-control with-icon" placeholder="Add your YouTube">
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Save Changes Button -->
                    <div class="submit-action-wrap">
                        <button type="submit" class="btn-save-changes" id="btnSaveChanges">
                            <span class="btn-save-text">Save Changes</span>
                            <span class="btn-save-spinner" style="display:none;"></span>
                        </button>
                    </div>

                </form>
            </main>

            <!-- 4. Toast Notification -->
            <div class="toast-message" id="toastMessage" role="status" aria-live="polite">
                <span class="toast-icon">✓</span>
                <span class="toast-text" id="toastText">Profile updated successfully!</span>
            </div>

            <!-- 5. Bottom Navigation Bar -->
            <nav class="bottom-nav" aria-label="Main Navigation">
                <a href="/pages/home.html" class="bottom-nav-item" aria-label="Home">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="nav-text">Home</span>
                </a>

                <a href="/pages/discover.html" class="bottom-nav-item" aria-label="Discover">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span class="nav-text">Discover</span>
                </a>

                <div class="bottom-nav-center">
                    <a href="/pages/create-post.html" class="fab-center-btn" aria-label="Create Post">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </a>
                </div>

                <a href="/pages/notifications.html" class="bottom-nav-item" aria-label="Activity">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="nav-text">Activity</span>
                </a>

                <a href="/pages/settings.html" class="bottom-nav-item active" aria-label="Profile" aria-current="page">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="nav-text">Profile</span>
                </a>
            </nav>

        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/settings-details.js"></script>
</body>
</html>
