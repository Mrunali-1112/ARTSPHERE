<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtSphere – Portfolio</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/portfolio.css">
</head>
<body>
    <div class="mobile-frame-container wide-landing">
        <main class="screen-container portfolio-screen">
            
            <!-- Sticky Header Navbar -->
            <header class="portfolio-header">
                <a href="/pages/home.html" class="header-logo-link" aria-label="ArtSphere Home">
                    <img src="/images/logo_header.png" alt="ArtSphere – The Artist Community" class="header-logo-img">
                </a>
                
                <div class="header-right-actions">
                    <button class="header-action-btn" id="headerSearchBtn" aria-label="Search" onclick="window.location.href='/pages/discover.html'">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                    
                    <button class="header-action-btn bell-btn" id="headerNotifyBtn" aria-label="Notifications" onclick="alert('No new notifications')">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notification-dot"></span>
                    </button>
                    
                    <div class="header-profile-dropdown" id="userMenuWrapper">
                        <div class="avatar-clickable" id="headerUserAvatarBtn" role="button" aria-label="Open User Menu">
                            <img src="/images/user_avatar_nav.png" alt="User Profile" class="header-user-avatar" id="headerUserAvatar">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.5" class="header-dropdown-chevron">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Sub-header (Back + Title + Add Work Button) -->
            <div class="portfolio-nav-header">
                <div class="nav-left-col">
                    <button class="btn-nav-back" id="btnBackToProfile" aria-label="Back to Profile">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </button>
                    <div class="portfolio-title-group">
                        <h1 class="portfolio-page-title">Portfolio</h1>
                        <p class="portfolio-page-subtitle">A collection of my creative work.</p>
                    </div>
                </div>

                <button class="btn-add-work" id="btnAddWork">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add Work</span>
                </button>
            </div>

            <!-- Categories / Filter Tabs -->
            <div class="portfolio-categories-container">
                <div class="category-scroll-wrapper">
                    <button class="portfolio-filter-pill active" data-category="All">All</button>
                    <button class="portfolio-filter-pill" data-category="Digital Art">Digital Art</button>
                    <button class="portfolio-filter-pill" data-category="Illustrations">Illustrations</button>
                    <button class="portfolio-filter-pill" data-category="Photography">Photography</button>
                    <button class="portfolio-filter-pill" data-category="Paintings">Paintings</button>
                    <button class="portfolio-filter-pill" data-category="Other">Other</button>
                </div>
            </div>

            <!-- Artwork Cards Grid (3 Columns) -->
            <div class="portfolio-grid-wrapper">
                <div class="portfolio-cards-grid" id="portfolioCardsGrid">
                    <!-- Loaded dynamically via GET /api/artists/{id}/portfolio -->
                </div>
            </div>

            <!-- Sticky Bottom Navigation Bar -->
            <nav class="discover-bottom-nav" aria-label="Bottom Navigation">
                <a href="/pages/home.html" class="nav-item" aria-label="Home">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="nav-label">Home</span>
                </a>

                <a href="/pages/discover.html" class="nav-item" aria-label="Discover">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span class="nav-label">Discover</span>
                </a>

                <!-- Central + Action Button -->
                <div class="nav-item-center">
                    <button class="nav-fab-btn" id="centralCreateBtn" aria-label="Create New Content">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>

                <a href="/pages/messages.html" class="nav-item" aria-label="Messages">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                    <span class="nav-label">Messages</span>
                </a>

                <a href="/pages/artist-profile.html?id=101" class="nav-item" id="bottomNavProfile" aria-label="Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>

            <!-- Modal: Add or Edit Artwork Flow -->
            <div class="artwork-modal-backdrop" id="artworkModalBackdrop">
                <div class="artwork-modal-card">
                    <div class="modal-header-row">
                        <h2 class="modal-title" id="modalTitle">Add Work</h2>
                        <button class="btn-close-modal" id="btnCloseModal" aria-label="Close">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#160D33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>

                    <form id="artworkForm" class="artwork-form">
                        <input type="hidden" id="editArtworkId" value="">

                        <div class="form-group">
                            <label for="artworkTitleInput" class="form-label">Artwork Title</label>
                            <input type="text" id="artworkTitleInput" class="form-input" placeholder="e.g. Sunlit Whispers" required>
                        </div>

                        <div class="form-group">
                            <label for="artworkCategorySelect" class="form-label">Art Form / Category</label>
                            <select id="artworkCategorySelect" class="form-select" required>
                                <option value="Digital Art">Digital Art</option>
                                <option value="Illustrations">Illustrations</option>
                                <option value="Photography">Photography</option>
                                <option value="Paintings">Paintings</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="artworkImageInput" class="form-label">Image URL / Preset</label>
                            <input type="text" id="artworkImageInput" class="form-input" placeholder="/images/artwork_sunlit.png" value="/images/artwork_sunlit.png" required>
                            <div class="preset-images-row">
                                <span class="preset-label">Presets:</span>
                                <button type="button" class="preset-chip" data-url="/images/artwork_sunlit.png">Sunlit</button>
                                <button type="button" class="preset-chip" data-url="/images/artwork_beyond_the_hills.png">Hills</button>
                                <button type="button" class="preset-chip" data-url="/images/artwork_curious.png">Cat</button>
                                <button type="button" class="preset-chip" data-url="/images/artwork_still.png">Floral</button>
                                <button type="button" class="preset-chip" data-url="/images/artwork_city_shades.png">Urban</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="artworkDescInput" class="form-label">Description (Optional)</label>
                            <textarea id="artworkDescInput" class="form-textarea" rows="3" placeholder="Tell the community about this piece..."></textarea>
                        </div>

                        <div class="modal-buttons-row">
                            <button type="button" class="btn-modal-cancel" id="btnCancelModal">Cancel</button>
                            <button type="submit" class="btn-modal-submit" id="btnSaveArtwork">Save Artwork</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Card Actions Dropdown (Floating Menu) -->
            <div class="card-action-menu" id="cardActionMenu">
                <button class="menu-item" id="menuActionEdit">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    <span>Edit Work</span>
                </button>
                <button class="menu-item text-danger" id="menuActionDelete">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>Delete Work</span>
                </button>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/portfolio.js"></script>
</body>
</html>
