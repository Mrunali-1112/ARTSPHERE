<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtSphere – Opportunity Details</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/opportunity-details.css">
</head>
<body>
    <div class="mobile-frame-container wide-landing">
        <main class="screen-container opp-details-screen">

            <!-- Sticky Header Navbar -->
            <header class="details-top-header">
                <a href="/pages/home.html" class="header-logo-link" aria-label="ArtSphere Home">
                    <img src="/images/logo_header.png" alt="ArtSphere – The Artist Community" class="header-logo-img">
                </a>

                <div class="header-right-actions">
                    <button class="header-action-btn" id="headerSearchBtn" aria-label="Search" onclick="window.location.href='/pages/opportunities.html'">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>

                    <button class="header-action-btn bell-btn" id="headerNotifyBtn" aria-label="Notifications" onclick="alert('No new notifications')">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notification-dot"></span>
                    </button>

                    <div class="header-profile-dropdown" id="userMenuWrapper">
                        <div class="avatar-clickable" id="headerUserAvatarBtn" role="button" aria-label="Open User Menu">
                            <img src="/images/user_avatar_nav.png" alt="User Profile" class="header-user-avatar" id="headerUserAvatar">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.5" class="header-dropdown-chevron">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="user-dropdown-menu" id="userDropdownMenu">
                            <a href="/pages/artist-profile.html?id=101" class="dropdown-item">My Profile</a>
                            <a href="/pages/portfolio.html?id=101" class="dropdown-item">My Portfolio</a>
                            <a href="/pages/opportunities.html" class="dropdown-item">Opportunities</a>
                            <div class="dropdown-divider"></div>
                            <button class="dropdown-item logout-item" id="logoutBtn">Log Out</button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Title Row with Back Arrow -->
            <div class="page-title-row">
                <a href="/pages/opportunities.html" class="back-link-btn" aria-label="Back to Opportunities">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <h1 class="page-title-text">Opportunity Details</h1>
            </div>

            <!-- Main Content Container (Loaded via JS) -->
            <div id="detailsContentContainer" class="details-content-wrapper">
                <div class="details-loading-shimmer"></div>
            </div>

            <!-- Bottom Navigation Bar -->
            <nav class="bottom-nav-bar" aria-label="Main Navigation">
                <a href="/pages/home.html" class="nav-item" aria-label="Home">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="nav-label">Home</span>
                </a>

                <a href="/pages/discover.html" class="nav-item" aria-label="Discover">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span class="nav-label">Discover</span>
                </a>

                <!-- Central + Action Button -->
                <div class="nav-item-center">
                    <button class="nav-fab-btn" id="centralCreateBtn" aria-label="Create New Content" onclick="window.location.href='/pages/portfolio.html?id=101'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>

                <a href="/pages/opportunities.html" class="nav-item active" aria-label="Opportunities">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    <span class="nav-label">Opportunities</span>
                </a>

                <a href="/pages/artist-profile.html?id=101" class="nav-item" id="bottomNavProfile" aria-label="Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>

        </main>
    </div>

    <!-- Application Confirmation Modal -->
    <div class="apply-modal-backdrop" id="applyModalBackdrop">
        <div class="apply-modal-dialog">
            <div class="apply-modal-header">
                <h3 class="apply-modal-title">Apply for Opportunity</h3>
                <button class="apply-modal-close" id="closeApplyModalBtn">&times;</button>
            </div>
            <div class="apply-modal-body">
                <p class="apply-modal-desc">Submit your application to <strong id="modalOrganizerName">Organization</strong> for <strong id="modalOppTitle">Opportunity</strong>.</p>
                <div class="form-group" style="margin-top: 14px;">
                    <label for="applyNotesInput" class="form-label">Note / Message to Organizer (Optional):</label>
                    <textarea id="applyNotesInput" class="form-textarea" rows="3" placeholder="Briefly describe your interest or attach your portfolio link..."></textarea>
                </div>
            </div>
            <div class="apply-modal-footer">
                <button class="btn-cancel" id="cancelApplyBtn">Cancel</button>
                <button class="btn-submit-apply" id="confirmApplyBtn">Submit Application &rarr;</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/opportunity-details.js"></script>
</body>
</html>
