<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration Requests – ArtSphere</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/collaboration-requests.css">
</head>
<body>
    <div class="app-layout">
        <main class="screen-container requests-screen">

            <!-- Top Header Navbar -->
            <header class="requests-top-header">
                <a href="/pages/collaborators.html" class="back-link" aria-label="Back to Collaborations">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </a>
                <h1 class="header-screen-title">Collaboration Requests</h1>
                <div class="header-ghost-spacer" style="width: 36px;"></div>
            </header>

            <!-- Page Intro Subtitle -->
            <div class="requests-intro-section">
                <h2 class="requests-heading">Manage Collaborations</h2>
                <p class="requests-subheading">Track and respond to incoming inquiries, view outgoing requests, and connect with approved project partners.</p>
            </div>

            <!-- 3 Tabs on ONE Page: Received, Sent, Approved -->
            <nav class="tabs-container" aria-label="Collaboration Request Status Tabs">
                <button class="tab-button active" id="tabReceived" data-type="received">
                    Received <span class="tab-badge" id="badgeReceived">0</span>
                </button>
                <button class="tab-button" id="tabSent" data-type="sent">
                    Sent <span class="tab-badge" id="badgeSent">0</span>
                </button>
                <button class="tab-button" id="tabApproved" data-type="approved">
                    Approved <span class="tab-badge" id="badgeApproved">0</span>
                </button>
            </nav>

            <!-- Requests List Container -->
            <div class="requests-list-container" id="requestsListContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading requests...</p>
                </div>
            </div>

            <!-- Toast Notification -->
            <div id="toastNotification" class="toast-notification" style="display: none;"></div>

            <!-- Bottom Navigation Bar (Elevated + Center Button) -->
            <nav class="bottom-nav-bar" aria-label="Bottom Navigation">
                <a href="/pages/home.html" class="nav-item" aria-label="Home">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="nav-label">Home</span>
                </a>

                <a href="/pages/discover.html" class="nav-item" aria-label="Discover">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span class="nav-label">Discover</span>
                </a>

                <!-- Central + Action Button -->
                <div class="nav-item-center">
                    <button class="nav-fab-btn" id="centralCreateBtn" aria-label="Post Collaboration" onclick="window.location.href='/pages/create-collaboration.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>

                <a href="/pages/collaborators.html" class="nav-item active" aria-label="Collab">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span class="nav-label">Collab</span>
                </a>

                <a href="/pages/artist-profile.html?id=101" class="nav-item" id="bottomNavProfile" aria-label="Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>

        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/collaboration-requests.js"></script>
</body>
</html>
