<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up – ArtSphere</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/signup.css">
</head>
<body>
    <div class="mobile-frame-container">
        <main class="screen-container signup-screen">
            <!-- Decorative Visual Elements -->
            <img src="/images/wooden_palette_top.png" alt="" class="decor-top-palette">
            <img src="/images/bottom_wave_decor.png" alt="" class="decor-bottom-wave">

            <!-- Top Nav with Back Button -->
            <nav class="top-nav-bar">
                <a href="/pages/landing.html" class="btn-icon-back" aria-label="Go Back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
            </nav>

            <!-- Centered Branding Header -->
            <header class="brand-header-centered">
                <img src="/images/logo_with_text.png" alt="ArtSphere – The Artist Community" class="brand-logo-img">
                <h1>Create Your <span class="highlight-coral">Account</span></h1>
                <p class="sub-tagline">Join ArtSphere and start your creative journey</p>
            </header>

            <!-- Sign Up Form -->
            <section class="signup-form-container">
                <div id="alertMessage" class="auth-alert-message"></div>

                <form id="signupForm" autocomplete="on">
                    <!-- Full Name -->
                    <div class="form-group">
                        <label class="form-label" for="fullName">Full Name</label>
                        <div class="input-icon-wrapper">
                            <span class="input-leading-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                class="form-input"
                                placeholder="Enter your full name"
                                required
                            >
                        </div>
                    </div>

                    <!-- Email Address -->
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-icon-wrapper">
                            <span class="input-leading-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                            </span>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-input"
                                placeholder="Enter your email"
                                required
                            >
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-icon-wrapper">
                            <span class="input-leading-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input has-trailing-icon"
                                placeholder="Create a password"
                                minlength="6"
                                required
                            >
                            <button type="button" class="input-trailing-action" id="togglePasswordBtn" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <div class="input-icon-wrapper">
                            <span class="input-leading-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                            </span>
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                class="form-input has-trailing-icon"
                                placeholder="Confirm your password"
                                minlength="6"
                                required
                            >
                            <button type="button" class="input-trailing-action" id="toggleConfirmPasswordBtn" aria-label="Toggle confirm password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- "I am an Artist of" Selection -->
                    <div class="form-group">
                        <label class="artist-type-selector-title">I am an Artist of</label>
                        <div class="artist-categories-row" id="artistCategoriesRow">
                            <!-- Musician (Default Selected) -->
                            <div class="category-select-card musician selected" data-category="Musician">
                                <span class="badge-check">&#10003;</span>
                                <div class="cat-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                                    </svg>
                                </div>
                                <span class="cat-name">Musician</span>
                            </div>

                            <!-- Dancer -->
                            <div class="category-select-card dancer" data-category="Dancer">
                                <span class="badge-check">&#10003;</span>
                                <div class="cat-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="5" r="2"/>
                                        <path d="m15 22-3-4-2 2-3-4"/>
                                        <path d="m18 13-6-2-4 3"/>
                                        <path d="m9 9 3 4 5-3"/>
                                    </svg>
                                </div>
                                <span class="cat-name">Dancer</span>
                            </div>

                            <!-- Painter -->
                            <div class="category-select-card painter" data-category="Painter">
                                <span class="badge-check">&#10003;</span>
                                <div class="cat-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C6.49 2 2 6.49 2 12c0 5.51 4.49 10 10 10 1.25 0 2.27-.92 2.27-2.16 0-.58-.23-1.11-.64-1.5-.4-.4-.63-.93-.63-1.51 0-1.24 1.02-2.25 2.26-2.25H17c2.76 0 5-2.24 5-5 0-5.51-4.49-9.58-10-9.58zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 8 6.5 8s1.5.67 1.5 1.5S7.33 11 6.5 11zm3-4C8.67 7 8 6.33 8 5.5S8.67 4 9.5 4s1.5.67 1.5 1.5S10.33 7 9.5 7zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 4 14.5 4s1.5.67 1.5 1.5S15.33 7 14.5 7zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                                    </svg>
                                </div>
                                <span class="cat-name">Painter</span>
                            </div>

                            <!-- Photographer -->
                            <div class="category-select-card photographer" data-category="Photographer">
                                <span class="badge-check">&#10003;</span>
                                <div class="cat-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                        <circle cx="12" cy="13" r="4"></circle>
                                    </svg>
                                </div>
                                <span class="cat-name">Photographer</span>
                            </div>

                            <!-- Writer -->
                            <div class="category-select-card writer" data-category="Writer">
                                <span class="badge-check">&#10003;</span>
                                <div class="cat-icon">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
                                        <line x1="16" y1="8" x2="2" y2="22"></line>
                                        <line x1="17.5" y1="15" x2="9" y2="15"></line>
                                    </svg>
                                </div>
                                <span class="cat-name">Writer</span>
                            </div>
                        </div>
                    </div>

                    <!-- Terms Checkbox -->
                    <div class="terms-agreement-row">
                        <input type="checkbox" id="termsCheck" required checked>
                        <label for="termsCheck">
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary-gradient" id="submitBtn">
                        Create Account
                        <span>&rarr;</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider-or">OR</div>

                <!-- Social Signups -->
                <div class="social-signup-grid">
                    <button type="button" class="btn-social">
                        <svg viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        Sign up with Google
                    </button>
                    <button type="button" class="btn-social">
                        <svg viewBox="0 0 24 24" fill="#1877F2">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Sign up with Facebook
                    </button>
                </div>
                <button type="button" class="btn-social" style="width: 100%;">
                    <svg viewBox="0 0 24 24" fill="#000000">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.77 1.06-1.85.94-2.93-.93.04-2.07.62-2.72 1.39-.58.67-1.09 1.77-.95 2.83 1.05.08 2.1-.52 2.73-1.29z"/>
                    </svg>
                    Sign up with Apple
                </button>

                <!-- Footer link -->
                <p class="signup-footer-text">
                    Already have an account?
                    <a href="/pages/login.html">Login</a>
                </p>
            </section>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/signup.js"></script>
</body>
</html>
