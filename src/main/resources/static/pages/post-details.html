<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Details – ArtSphere</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/post-details.css">
</head>
<body>
    <div class="app-layout">
        <main class="screen-container post-details-screen">

            <!-- Sticky Top Header Navbar -->
            <header class="post-details-header">
                <a href="/pages/feed.html" class="back-link-btn" aria-label="Back to feed">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C102C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>

                <a href="/pages/home.html" class="header-logo-link" aria-label="ArtSphere Home">
                    <img src="/images/logo_header.png" alt="ArtSphere – The Artist Community" class="header-logo-img">
                </a>

                <div class="header-profile-dropdown" id="userMenuWrapper">
                    <div class="avatar-clickable" id="headerUserAvatarBtn" role="button" aria-label="Open User Menu">
                        <img src="/images/user_avatar_nav.png" alt="User Profile" class="header-user-avatar" id="headerUserAvatar">
                    </div>
                </div>
            </header>

            <!-- Dynamic Post Details Wrapper (Populated via JS) -->
            <div id="postDetailsContent" class="post-content-container">
                <div class="post-loading-spinner">
                    <div class="spinner"></div>
                    <p>Loading post details...</p>
                </div>
            </div>

            <!-- Bottom Navigation Bar -->
            <nav class="bottom-nav-bar" aria-label="Main Navigation">
                <a href="/pages/home.html" class="nav-item" aria-label="Home">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="nav-label">Home</span>
                </a>

                <a href="/pages/discover.html" class="nav-item" aria-label="Discover">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                    <span class="nav-label">Discover</span>
                </a>

                <!-- Central + Action Button -->
                <div class="nav-item-center">
                    <button class="nav-fab-btn" id="centralCreateBtn" aria-label="Create New Post" onclick="window.location.href='/pages/create-post.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>

                <a href="/pages/feed.html" class="nav-item active" aria-label="Feed">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                        <line x1="8" y1="21" x2="16" y2="21"></line>
                        <line x1="12" y1="17" x2="12" y2="21"></line>
                    </svg>
                    <span class="nav-label">Feed</span>
                </a>

                <a href="/pages/artist-profile.html?id=101" class="nav-item" id="bottomNavProfile" aria-label="Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>

        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/post-details.js"></script>
</body>
</html>
