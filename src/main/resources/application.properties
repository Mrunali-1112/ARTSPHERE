# ArtSphere Application Configuration
spring.application.name=ArtSphere
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/artsphere_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC Template Logging
logging.level.org.springframework.jdbc=DEBUG

# SQL Initialization
spring.sql.init.mode=always

